apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-sum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator-sum
  template:
    metadata:
      labels:
        app: calculator-sum
    spec:
      containers:
        - name: calculator-sum-container
          image: 192.168.50.4:5000/calculator-sum:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 50001
              protocol: TCP