apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-calc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator-calc
  template:
    metadata:
      labels:
        app: calculator-calc
    spec:
      containers:
        - name: calculator-calc-container
          image: 192.168.50.4:5000/calculator-calc:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP